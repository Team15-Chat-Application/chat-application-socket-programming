name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node:
    name: Node build, unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - id: build
        run: npm run build
      - name: Unit tests
        run: npm run test:unit -- --json --outputFile=reports/node-unit.json
      - name: Integration tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:integration -- --json --outputFile=reports/node-integration.json
      - name: Upload available test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: node-test-reports
          path: reports/*.json
          if-no-files-found: warn
      - name: Upload Node build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: node-development-build
          path: dist/
          if-no-files-found: error
  python:
    name: Python build, unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python_backend/requirements-dev.lock.txt
      - run: python -m pip install -r python_backend/requirements-dev.lock.txt
      - id: build
        run: python -m compileall -q python_backend/chat_backend
      - run: mkdir -p reports
      - name: Unit tests
        run: python -m pytest python_backend/tests/unit --junitxml=reports/python-unit.xml
      - name: Integration tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python -m pytest python_backend/tests/integration --junitxml=reports/python-integration.xml
      - name: Upload available test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-test-reports
          path: reports/*.xml
          if-no-files-found: warn
      - name: Upload secondary backend
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-development-build
          path: |
            python_backend/chat_backend/*.py
            python_backend/requirements-dev.lock.txt
          if-no-files-found: error
