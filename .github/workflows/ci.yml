
name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node build, unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - id: build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit -- --json --outputFile=reports/node-unit.json

      - name: Integration tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:integration -- --json --outputFile=reports/node-integration.json

      - name: Isolated STP seed fixture and overwrite guards
        run: node scripts/seed_review.js --check

      - name: Upload available test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: node-test-reports
          path: reports/*.json
          if-no-files-found: warn

      - name: Real receiver delivery and persistence measurements
        run: node scripts/performance_check.js

      - name: Local TLS and authenticated WSS checks
        run: |
          python scripts/generate_test_tls.py
          node scripts/tls_check.js

      - name: Upload measured transport evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: transport-evidence
          path: |
            reports/performance.json
            reports/tls.json

      - name: Upload Node build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: node-development-build
          path: dist/
          if-no-files-found: error

  python:
    name: Python build, unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python_backend/requirements-dev.lock.txt

      - run: python -m pip install -r python_backend/requirements-dev.lock.txt

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - id: build
        run: python -m compileall -q python_backend/chat_backend

      - run: mkdir -p reports

      - name: Unit tests
        run: python -m pytest python_backend/tests/unit --junitxml=reports/python-unit.xml

      - name: Integration tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python -m pytest python_backend/tests/integration --junitxml=reports/python-integration.xml

      - name: Build Node launcher for cross-backend smoke checks
        run: npm run build

      - name: Real launcher health and fail-closed smoke checks
        env:
          JWT_SECRET: smoke-test-only-key-not-for-production-123456
        run: python scripts/smoke_startup.py --report reports/launcher-smoke.json

      - name: Actual network account-to-chat flow and restart persistence
        run: node scripts/system_check.js

      - name: Actual Flask TLS/WSS production launcher and CSP
        run: |
          python scripts/generate_test_tls.py
          node scripts/python_tls_check.js

      - name: Upload available test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: python-test-reports
          path: |
            reports/*.xml
            reports/launcher-smoke.json
            reports/system.json
            reports/python-tls.json
          if-no-files-found: warn

      - name: Upload secondary backend
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: python-development-build
          path: |
            python_backend/chat_backend/*.py
            python_backend/requirements-dev.lock.txt
            public/
            dist/public/vendor/

  browser:
    name: Browser product and accessibility acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run browser:install -- --with-deps
      - run: npm run test:browser
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: browser-evidence
          path: |
            reports/browser-results.json
            reports/chat-*.png
          if-no-files-found: error
